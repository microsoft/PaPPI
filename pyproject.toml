[project]
name = "pappi"
version = "0.1.0"
description = "Deployment metrics with confidence intervals from biased labels."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Akram Zaytar" },
    { name = "Kemunto Ochwang'i" },
    { name = "Girmaw A. Tadesse" },
    { name = "Gilles Q. Hacheme" },
    { name = "Rahul Dodhia" },
    { name = "Inbal Becker-Reshef" },
    { name = "Juan M. Lavista Ferres" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.6",
    "pyyaml>=6.0",
    "rich>=13",
    "xgboost-cpu==3.2.0; sys_platform != 'darwin'",
    "xgboost==3.2.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
geo = [
    "geopandas>=1.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "pyogrio>=0.9",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
]

[project.urls]
Homepage = "https://github.com/microsoft/PaPPI"

[project.scripts]
pappi = "pappi.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
